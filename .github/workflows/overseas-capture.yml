name: Overseas game charts
on:
  workflow_dispatch:
    inputs:
      collect_only:
        description: Validate sources without server delivery
        type: boolean
        default: false
  schedule:
    - cron: '40 0 * * *'
    - cron: '10 15 * * *'
permissions:
  contents: read
concurrency:
  group: overseas-game-charts
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
          cache: maven
          cache-dependency-path: external-capture/pom.xml
      - name: Build deterministic parser
        run: |
          mvn -B -q -f external-capture/pom.xml package
          python3 -m unittest discover -s scripts/tests -v
      - name: Capture and deliver evidence
        env:
          COLLECT_ONLY: ${{ inputs.collect_only }}
          OVERSEAS_CAPTURE_SSH_KEY: ${{ secrets.OVERSEAS_CAPTURE_SSH_KEY }}
          OVERSEAS_CAPTURE_KNOWN_HOSTS: ${{ secrets.OVERSEAS_CAPTURE_KNOWN_HOSTS }}
        run: |
          args=()
          if [ "$COLLECT_ONLY" = "true" ]; then args+=(--collect-only); fi
          python3 scripts/overseas-capture.py --jar external-capture/target/external-capture-0.1.0-SNAPSHOT-cli.jar "${args[@]}"
      - name: Connectivity diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import socket,urllib.request
          for host,port in [('14.103.231.1',22),('14.103.231.1',80),('14.103.231.1',443),('14.103.231.1',18080),('www.appbrain.com',443)]:
            try:
              with socket.create_connection((host,port),5):print(host,port,'TCP_OK')
            except Exception as e:print(host,port,type(e).__name__)
          try:
            req=urllib.request.Request('https://www.appbrain.com/stats/google-play-rankings/top_free/game/us',headers={'User-Agent':'YoukiaExternalCapture/1.1 public-source-research'})
            with urllib.request.urlopen(req,timeout=20) as r:print('APPBRAIN_HTTP',r.status,'BYTES',len(r.read()))
          except Exception as e:print('APPBRAIN_HTTP',type(e).__name__)
          PY

