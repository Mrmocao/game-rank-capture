# Include inside the IAA server block. Never expose port 6081/5991 publicly.
location = /_capture-login-auth {
 internal;
 proxy_pass http://127.0.0.1:18081/api/v1/admin/capture-login/viewer-auth;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Cookie $http_cookie;
 proxy_set_header Origin $http_origin;
 proxy_set_header X-Forwarded-Proto $capture_public_scheme;
}
location /capture-login/ {
 auth_request /_capture-login-auth;
 proxy_pass http://127.0.0.1:6081/;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host 127.0.0.1;
 proxy_read_timeout 1800s;
 proxy_send_timeout 1800s;
 proxy_buffering off;
 add_header Cache-Control "no-store" always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy no-referrer always;
}
