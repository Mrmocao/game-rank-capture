limit_req_zone $binary_remote_addr zone=iaa_overseas:1m rate=2r/m;
server {
 listen 443 ssl;
 server_name 14.103.231.1;
 ssl_certificate /etc/iaa-radar/overseas-tls.crt;
 ssl_certificate_key /etc/iaa-radar/overseas-tls.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 24m;
 client_body_timeout 60s;
 location /overseas/ {
  limit_req zone=iaa_overseas burst=4 nodelay;
  proxy_pass http://127.0.0.1:18642;
  proxy_read_timeout 660s;
  proxy_send_timeout 60s;
  proxy_set_header Authorization $http_authorization;
 }
 location / { return 404; }
}
